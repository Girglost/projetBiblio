name: biblio

services:
  mysql:
    image: mysql:8.0.45
    container_name: biblio-mysql

    networks:
      - biblio

    environment:
      MYSQL_DATABASE: projet_biblio
      MYSQL_ROOT_PASSWORD: root

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 3s
      retries: 10
      interval: 5s

  java:
    image: ajc/biblio-quarkus

    networks:
      - biblio

    ports:
      - 8080:8080

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/projet_biblio
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

  angular:
    image: ajc/biblio-angular

    networks:
      - biblio

    ports:
      - 81:80

    depends_on:
      - java
      

networks:
  biblio:
    name: biblio
