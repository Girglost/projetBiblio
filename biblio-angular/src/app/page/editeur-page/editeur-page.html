<div>Liste des Editeurs</div>

<table>
    <thead>
        <tr>
            <td>
                Id
            </td>
            <td>
                Nom
            </td>
            <td>
                Pays
            </td>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let editeur of editeurs$ | async">
            <td>{{ editeur.id }}</td>
            <td>{{ editeur.nom }}</td>
            <td>{{ editeur.pays }}</td>
            <td>
                <button (click)="edit(editeur)">MODIFIER</button>
                <button (click)="remove(editeur)">SUPPRIMER</button>
            </td>
        </tr>
    </tbody>
</table>

<form (submit)="addOrUpdate()" [formGroup]="formEditeur">
    <input type="text" [formControl]="formCtrlNom">
    <div *ngIf="formCtrlNom.invalid && formCtrlNom.dirty && formCtrlNom.hasError('minlength')">
        Le nom de l'éditeur doit contenir au moins 3 caractères.
    </div>
    <input type="text" [formControl]="formCtrlPays">
    <div *ngIf="formCtrlPays.invalid && formCtrlPays.dirty && formCtrlPays.hasError('minlength')">
        Le pays de l'éditeur doit contenir au moins 3 caractères.
    </div>

    <div>
        <input [disabled]="formEditeur.invalid" type="submit" [value]="editingEditeurId ? 'Modifier' : 'Ajouter'" />
    </div>
</form>
